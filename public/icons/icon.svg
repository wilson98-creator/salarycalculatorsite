<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SalaryCalc">
  <!-- White box with green outline -->
  <rect x="3" y="3" width="58" height="58" rx="12" fill="#ffffff" stroke="#65a30d" stroke-width="3"/>
  <!-- S in deep ink, serif italic -->
  <text x="32" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" font-style="italic" fill="#0c1f47">S</text>
  <!-- Underline accent in lime green -->
  <line x1="14" y1="52" x2="50" y2="52" stroke="#84cc16" stroke-width="3" stroke-linecap="round"/>
</svg>
